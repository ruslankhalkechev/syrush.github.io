        /* Активная модель получает больше места и подсветку */

        .model-cell canvas {

        /* У активной модели курсор «прицел» — понятно, что можно ставить точку */

        /* Мобильная адаптация: модели в столбик */

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (() => {
            'use strict';

            /* ============================================================
             *  Начальные параметры каждой из 6 моделей:
             *    a, b   — полуоси эллипса
             *    ang    — угол поворота, °
             *    point  — начальные координаты точки
             *             (в единицах полуосей относительно центра эллипса)
             *
             *  Модели 1–2 : a = 200, b = 100, угол 85°
             *  Модели 3–4 : a = 230, b = 125, угол 85°
             *  Модели 5–6 : a = 200, b = 100, угол 85°
             * ============================================================ */
            const DEFAULT_BY_INDEX = [
                { a: 200, b: 100, ang: 85, point: { x:   6, y:   115 } },  // Модель 1
                { a: 200, b: 100, ang: 85, point: { x:   4, y:   157 } },  // Модель 2
                { a: 230, b: 125, ang: 85, point: { x:   11, y:   134 } },  // Модель 3
                { a: 230, b: 125, ang: 85, point: { x:   16, y:   117 } },  // Модель 4
                { a: 200, b: 100, ang: 85, point: { x:   32, y:   133 } },  // Модель 5
                { a: 200, b: 100, ang: 85, point: { x:   -1, y:   143 } },  // Модель 6
            ];

            const N_MODELS = DEFAULT_BY_INDEX.length;

            const COMMON = {
                ellipseColor: '#2563eb',
                evoluteColor: '#e11d48',
            };

            const state = {
                n: 60,
                showEllipse: true,
                showNormals: true,
                showEvolute: true,
                fillEvolute: false,
                pointColor: '#000000',
                pointSize: 4,
            };

            const models = [];

            for (let i = 0; i < N_MODELS; i++) {
                const d = DEFAULT_BY_INDEX[i];
                models.push({
                    index: i,
                    a: d.a,
                    b: d.b,
                    ang: d.ang,
                    ellipseColor: COMMON.ellipseColor,
                    evoluteColor: COMMON.evoluteColor,
                    point: { x: d.point.x, y: d.point.y },
                    canvas: null,
                    ctx: null,
                    cell: null,
                    _scale: 1,
                });
            }

            let activeModelIndex = -1; // ни одна модель не активна изначально

            /* ============================================================
             *  Утилиты
             * ============================================================ */
            const $ = id => document.getElementById(id);

            function hexToRgba(hex, alpha) {
                const h = String(hex).replace('#', '');
                const v = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
                const r = parseInt(v.slice(0, 2), 16);
                const g = parseInt(v.slice(2, 4), 16);
                const b = parseInt(v.slice(4, 6), 16);
                return `rgba(${r},${g},${b},${alpha})`;
            }

            /* ============================================================
             *  Габариты фигуры (эллипс + эволюта) с учётом поворота.
             * ============================================================ */
            function computeHalfExtents(m) {
                const a = m.a, b = m.b;
                const evX = Math.abs((a * a - b * b) / a);
                const evY = Math.abs((a * a - b * b) / b);

                const xHalf = Math.max(a, evX);
                const yHalf = Math.max(b, evY);

                const phi = m.ang * Math.PI / 180;
                const c = Math.abs(Math.cos(phi));
                const s = Math.abs(Math.sin(phi));

                return {
                    halfW: xHalf * c + yHalf * s,
                    halfH: xHalf * s + yHalf * c,
                };
            }

            function scaleForCanvas(m, W, H) {
                const { halfW, halfH } = computeHalfExtents(m);
                const margin = 10;
                let s = Math.min((W / 2 - margin) / halfW, (H / 2 - margin) / halfH);
                if (!isFinite(s) || s <= 0) s = 0.1;
                return s;
            }

            /* ============================================================
             *  Отрисовка одной модели
             * ============================================================ */
            function drawModel(m) {
                const canvas = m.canvas;
                const ctx = m.ctx;
                if (!canvas || !ctx) return;

                const rect = canvas.getBoundingClientRect();
                const W = rect.width;
                const H = rect.height;
                if (W < 4 || H < 4) return;

                const dpr = window.devicePixelRatio || 1;
                const pw = Math.max(1, Math.round(W * dpr));
                const ph = Math.max(1, Math.round(H * dpr));
                if (canvas.width !== pw || canvas.height !== ph) {
                    canvas.width = pw;
                    canvas.height = ph;
                }
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const cx = W / 2;
                const cy = H / 2;

                /* ---- фон ---- */
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, W, H);

                /* ---- оси ---- */
                ctx.strokeStyle = 'rgba(15,23,42,0.07)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, cy); ctx.lineTo(W, cy);
                ctx.moveTo(cx, 0); ctx.lineTo(cx, H);
                ctx.stroke();

                /* ---- поворот ---- */
                const phi = m.ang * Math.PI / 180;
                const cos = Math.cos(phi);
                const sin = Math.sin(phi);
                const rot = (x, y) => [x * cos - y * sin, x * sin + y * cos];

                /* ---- автомасштаб ---- */
                const scale = scaleForCanvas(m, W, H);
                m._scale = scale;

                const toX = x => cx + x * scale;
                const toY = y => cy + y * scale;

                /* ---- эллипс ---- */
                if (state.showEllipse) {
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(phi);
                    ctx.strokeStyle = m.ellipseColor;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, m.a * scale, m.b * scale, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                /* ---- нормали ---- */
                if (state.showNormals) {
                    ctx.strokeStyle = 'rgba(15,23,42,0.28)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    for (let i = 0; i < state.n; i++) {
                        const t = i / state.n * Math.PI * 2;
                        const ct = Math.cos(t), st = Math.sin(t);
                        const px = m.a * ct, py = m.b * st;
                        const ex = (m.a * m.a - m.b * m.b) / m.a * ct ** 3;
                        const ey = (m.b * m.b - m.a * m.a) / m.b * st ** 3;
                        const [Px, Py] = rot(px, py);
                        const [Ex, Ey] = rot(ex, ey);
                        ctx.moveTo(toX(Px), toY(Py));
                        ctx.lineTo(toX(Ex), toY(Ey));
                    }
                    ctx.stroke();
                }

                /* ---- эволюта ---- */
                const STEPS = 480;
                const pts = new Array(STEPS + 1);
                for (let i = 0; i <= STEPS; i++) {
                    const t = i / STEPS * Math.PI * 2;
                    const ct = Math.cos(t), st = Math.sin(t);
                    const ex = (m.a * m.a - m.b * m.b) / m.a * ct ** 3;
                    const ey = (m.b * m.b - m.a * m.a) / m.b * st ** 3;
                    const [Ex, Ey] = rot(ex, ey);
                    pts[i] = [toX(Ex), toY(Ey)];
                }

                if (state.fillEvolute) {
                    ctx.fillStyle = hexToRgba(m.evoluteColor, 0.16);
                    ctx.beginPath();
                    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
                    ctx.closePath();
                    ctx.fill();
                }

                if (state.showEvolute) {
                    ctx.strokeStyle = m.evoluteColor;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
                    ctx.stroke();
                }

                /* ---- точка ---- */
                if (m.point) {
                    const px = toX(m.point.x);
                    const py = toY(m.point.y);
                    ctx.beginPath();
                    ctx.arc(px, py, state.pointSize, 0, Math.PI * 2);
                    ctx.fillStyle = state.pointColor;
                    ctx.fill();
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                    ctx.stroke();
                }
            }

            /* ============================================================
             *  Пакетная отрисовка
             * ============================================================ */
            let rafPending = false;
            function scheduleDrawAll() {
                if (rafPending) return;
                rafPending = true;
                requestAnimationFrame(() => {
                    rafPending = false;
                    models.forEach(drawModel);
                });
            }
            function drawAll() {
                models.forEach(drawModel);
            }

            /* ============================================================
             *  Активная модель
             *  index = -1  →  снять активность со всех
             * ============================================================ */
            const row1 = $('row1');
            const row2 = $('row2');

            function setActiveModel(index) {
                if (activeModelIndex === index) return;
                activeModelIndex = index;

                models.forEach((m, i) => {
                    m.cell.classList.toggle('active', i === index);
                });

                row1.classList.toggle('has-active', index >= 0 && index < 3);
                row2.classList.toggle('has-active', index >= 3);

                setTimeout(scheduleDrawAll, 320);
            }

            /* ============================================================
             *  Создание 6 панелей
             * ============================================================ */
            models.forEach((m, i) => {
                const cell = document.createElement('div');
                cell.className = 'model-cell';

                const canvas = document.createElement('canvas');
                canvas.id = `canvas-${i}`;

                const label = document.createElement('div');
                label.className = 'model-label';
                label.textContent = `Model ${i + 1}`;

                cell.appendChild(canvas);
                cell.appendChild(label);
                (i < 3 ? row1 : row2).appendChild(cell);

                m.cell = cell;
                m.canvas = canvas;
                m.ctx = canvas.getContext('2d');

                attachPointer(canvas, m);
            });

            /* ============================================================
             *  Клик по канвасу:
             *    - если модель НЕ активна  →  только активируем её;
             *    - если модель уже активна → ставим / перетаскиваем точку.
             * ============================================================ */
            function attachPointer(canvas, m) {
                canvas.addEventListener('pointerdown', ev => {
                    ev.preventDefault();

                    if (activeModelIndex !== m.index) {
                        setActiveModel(m.index);
                        return;
                    }

                    const place = e => {
                        const r = canvas.getBoundingClientRect();
                        const sc = scaleForCanvas(m, r.width, r.height);
                        m._scale = sc;

                        const px = e.clientX - r.left - r.width / 2;
                        const py = e.clientY - r.top - r.height / 2;
                        m.point = {
                            x: Math.round(px / sc),
                            y: Math.round(py / sc),
                        };
                        updatePointInputs(m, m.index);
                        drawModel(m);
                    };

                    try { canvas.setPointerCapture(ev.pointerId); } catch (_) { }
                    place(ev);

                    const onMove = e => { if (e.pointerId === ev.pointerId) place(e); };
                    const onUp = () => {
                        canvas.removeEventListener('pointermove', onMove);
                        canvas.removeEventListener('pointerup', onUp);
                        canvas.removeEventListener('pointercancel', onUp);
                    };
                    canvas.addEventListener('pointermove', onMove);
                    canvas.addEventListener('pointerup', onUp);
                    canvas.addEventListener('pointercancel', onUp);
                });
            }

            /* ============================================================
             *  Клик вне моделей → снять активность со всех
             * ============================================================ */
            document.addEventListener('pointerdown', ev => {
                if (activeModelIndex === -1) return;
                if (ev.target.closest('.model-cell')) return;
                if (ev.target.closest('.sidebar')) return;
                setActiveModel(-1);
            });

            /* ============================================================
             *  Синхронизация полей координат точки
             * ============================================================ */
            function updatePointInputs(m, i, force = false) {
                const pxEl = $(`px-${i}`);
                const pyEl = $(`py-${i}`);
                if (!pxEl || !pyEl) return;
                if (!force && (document.activeElement === pxEl || document.activeElement === pyEl)) return;

                if (m.point) {
                    pxEl.value = Math.round(m.point.x);
                    pyEl.value = Math.round(m.point.y);
                } else {
                    pxEl.value = '';
                    pyEl.value = '';
                }
            }

            /* ============================================================
             *  Построение боковой панели
             * ============================================================ */
            function buildSidebar() {
                const acc = $('modelsAccordion');

                acc.innerHTML = models.map((m, i) => `
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button"
                  data-bs-toggle="collapse" data-bs-target="#acc-${i}"
                  aria-expanded="false" aria-controls="acc-${i}">
            <span class="legend-dot" id="dot-${i}" style="background:${m.ellipseColor}"></span>
            Модель ${i + 1}
          </button>
        </h2>
        <div id="acc-${i}" class="accordion-collapse collapse" data-bs-parent="#modelsAccordion">
          <div class="accordion-body">

            <label class="form-label d-flex justify-content-between" for="a-${i}">
              <span>Полуось <em>a</em></span><span class="val" id="av-${i}">${m.a}</span>
            </label>
            <input type="range" class="form-range" id="a-${i}"
                   min="40" max="420" step="1" value="${m.a}">

            <label class="form-label d-flex justify-content-between" for="b-${i}">
              <span>Полуось <em>b</em></span><span class="val" id="bv-${i}">${m.b}</span>
            </label>
            <input type="range" class="form-range" id="b-${i}"
                   min="40" max="420" step="1" value="${m.b}">

            <label class="form-label d-flex justify-content-between" for="ang-${i}">
              <span>Угол поворота</span>
              <span class="val"><span id="angv-${i}">${m.ang}</span>°</span>
            </label>
            <input type="range" class="form-range" id="ang-${i}"
                   min="-180" max="180" step="1" value="${m.ang}">

            <div class="row g-2 mt-1">
              <div class="col-6">
                <label class="form-label" for="ec-${i}">Цвет эллипса</label>
                <input type="color" class="form-control form-control-color w-100"
                       id="ec-${i}" value="${m.ellipseColor}">
              </div>
              <div class="col-6">
                <label class="form-label" for="vc-${i}">Цвет эволюты</label>
                <input type="color" class="form-control form-control-color w-100"
                       id="vc-${i}" value="${m.evoluteColor}">
              </div>
            </div>

            <div class="row g-2 mt-2 align-items-end">
              <div class="col-5">
                <label class="form-label" for="px-${i}">Точка X</label>
                <input type="number" class="form-control form-control-sm"
                       id="px-${i}" step="1" value="${m.point.x}">
              </div>
              <div class="col-5">
                <label class="form-label" for="py-${i}">Точка Y</label>
                <input type="number" class="form-control form-control-sm"
                       id="py-${i}" step="1" value="${m.point.y}">
              </div>
              <div class="col-2">
                <button class="btn btn-sm btn-outline-secondary w-100"
                        id="clr-${i}" title="Убрать точку">✕</button>
              </div>
            </div>

          </div>
        </div>
      </div>
    `).join('');

                models.forEach((m, i) => {
                    $(`a-${i}`).addEventListener('input', e => {
                        m.a = +e.target.value;
                        $(`av-${i}`).textContent = m.a;
                        drawModel(m);
                    });

                    $(`b-${i}`).addEventListener('input', e => {
                        m.b = +e.target.value;
                        $(`bv-${i}`).textContent = m.b;
                        drawModel(m);
                    });

                    $(`ang-${i}`).addEventListener('input', e => {
                        m.ang = +e.target.value;
                        $(`angv-${i}`).textContent = m.ang;
                        drawModel(m);
                    });

                    $(`ec-${i}`).addEventListener('input', e => {
                        m.ellipseColor = e.target.value;
                        $(`dot-${i}`).style.background = m.ellipseColor;
                        drawModel(m);
                    });

                    $(`vc-${i}`).addEventListener('input', e => {
                        m.evoluteColor = e.target.value;
                        drawModel(m);
                    });

                    const onPointInput = () => {
                        const xEl = $(`px-${i}`);
                        const yEl = $(`py-${i}`);
                        const x = parseFloat(xEl.value);
                        const y = parseFloat(yEl.value);

                        if (Number.isFinite(x) && Number.isFinite(y)) {
                            m.point = { x, y };
                        } else if (Number.isFinite(x)) {
                            m.point = { x, y: 0 };
                            yEl.value = 0;
                        } else if (Number.isFinite(y)) {
                            m.point = { x: 0, y };
                            xEl.value = 0;
                        } else {
                            m.point = null;
                        }
                        drawModel(m);
                    };
                    $(`px-${i}`).addEventListener('input', onPointInput);
                    $(`py-${i}`).addEventListener('input', onPointInput);

                    $(`clr-${i}`).addEventListener('click', () => {
                        m.point = null;
                        updatePointInputs(m, i, true);
                        drawModel(m);
                    });
                });

                models.forEach((m, i) => updatePointInputs(m, i, true));
            }

            /* ============================================================
             *  Общие контролы
             * ============================================================ */
            function wireGlobalControls() {
                $('pointColor').addEventListener('input', e => {
                    state.pointColor = e.target.value;
                    drawAll();
                });

                $('pointSize').addEventListener('input', e => {
                    state.pointSize = +e.target.value;
                    $('pointSizeV').textContent = state.pointSize;
                    drawAll();
                });

                $('n').addEventListener('input', e => {
                    state.n = +e.target.value;
                    $('nv').textContent = state.n;
                    drawAll();
                });

                ['showEllipse', 'showNormals', 'showEvolute', 'fillEvolute'].forEach(id => {
                    $(id).addEventListener('change', e => {
                        state[id] = e.target.checked;
                        drawAll();
                    });
                });

                /* ---- Сброс: возвращаем каждую модель к её DEFAULT_BY_INDEX ---- */
                $('reset').addEventListener('click', () => {
                    state.n = 60;
                    state.showEllipse = true;
                    state.showNormals = true;
                    state.showEvolute = true;
                    state.fillEvolute = false;
                    state.pointColor = '#000000';
                    state.pointSize = 4;

                    models.forEach((m, i) => {
                        const d = DEFAULT_BY_INDEX[i];
                        m.a = d.a;
                        m.b = d.b;
                        m.ang = d.ang;
                        m.ellipseColor = COMMON.ellipseColor;
                        m.evoluteColor = COMMON.evoluteColor;
                        m.point = { x: d.point.x, y: d.point.y };
                    });

                    setActiveModel(-1);
                    syncSidebar();
                    drawAll();
                });
            }

            /* ============================================================
             *  Полная синхронизация панели со состоянием
             * ============================================================ */
            function syncSidebar() {
                models.forEach((m, i) => {
                    $(`a-${i}`).value = m.a;
                    $(`av-${i}`).textContent = m.a;
                    $(`b-${i}`).value = m.b;
                    $(`bv-${i}`).textContent = m.b;
                    $(`ang-${i}`).value = m.ang;
                    $(`angv-${i}`).textContent = m.ang;
                    $(`ec-${i}`).value = m.ellipseColor;
                    $(`vc-${i}`).value = m.evoluteColor;
                    $(`dot-${i}`).style.background = m.ellipseColor;
                    updatePointInputs(m, i, true);
                });

                $('pointColor').value = state.pointColor;
                $('pointSize').value = state.pointSize;
                $('pointSizeV').textContent = state.pointSize;
                $('n').value = state.n;
                $('nv').textContent = state.n;
                $('showEllipse').checked = state.showEllipse;
                $('showNormals').checked = state.showNormals;
                $('showEvolute').checked = state.showEvolute;
                $('fillEvolute').checked = state.fillEvolute;
            }

            /* ============================================================
             *  Сворачивание боковой панели (гамбургер)
             * ============================================================ */
            function wireSidebarToggle() {
                const sidebar = $('sidebar');
                const btn = $('sidebarToggle');

                btn.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                    const collapsed = sidebar.classList.contains('collapsed');
                    btn.classList.toggle('is-open', !collapsed);
                    btn.title = collapsed ? 'Развернуть панель параметров' : 'Свернуть панель параметров';
                    setTimeout(scheduleDrawAll, 260);
                });
            }

            /* ============================================================
             *  Реакция на изменение размеров
             * ============================================================ */
            function wireResize() {
                if (window.ResizeObserver) {
                    const ro = new ResizeObserver(() => scheduleDrawAll());
                    ro.observe($('modelsContainer'));
                    ro.observe($('sidebar'));
                }
                window.addEventListener('resize', scheduleDrawAll);
                window.addEventListener('orientationchange', scheduleDrawAll);
            }

            /* ============================================================
             *  Старт
             * ============================================================ */
            buildSidebar();
            wireGlobalControls();
            wireSidebarToggle();
            wireResize();

            requestAnimationFrame(() => {
                requestAnimationFrame(drawAll);
            });
        })();
    </script>
</body>

</html>
